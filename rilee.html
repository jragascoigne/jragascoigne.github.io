<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>rilee</title>
		<link rel="icon" type="image/png" href="/static/img/favicon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
			rel="stylesheet"
		/>
		<script src="rilee.js" defer></script>
		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

		<link rel="stylesheet" href="/static/rilee.css" />
	</head>
	<body>
		<main id="app-root"></main>

		<template id="genshin-layout">
			<div class="links">
				<a class="rilee-link" href="/rilee">back</a>
			</div>
			<div class="genshin-container">
				<div class="container-title">track Δprimos</div>

				<div class="primos-submit-container">
					<input
						placeholder="input total primos"
						class="primos-input"
					/>

					<div class="primos-submit">
						<svg
							xmlns="http://www.w3.org/2000/svg"
							width="24"
							height="24"
							viewBox="0 0 24 24"
							fill="currentColor"
						>
							<path
								d="M20.285 2l-11.285 11.567-5.286-5.011-3.714 3.716 9 8.728 15-15.285z"
							/>
						</svg>
					</div>
				</div>
				.
				<div class="controls-container">
					<div class="clear-section">
						<button class="clear-last" type="button">
							Clear last
						</button>
						<button class="clear-all" type="button">
							Clear all
						</button>
					</div>
					<div class="button-container">
						<button
							class="zoom-out"
							type="button"
							aria-label="Zoom out"
						>
							<svg
								viewBox="0 0 16 16"
								fill="currentColor"
								xmlns="http://www.w3.org/2000/svg"
							>
								<path d="M1 10L1 6L15 6V10L1 10Z"></path>
							</svg>
						</button>
						<button
							class="zoom-in"
							type="button"
							aria-label="Zoom in"
						>
							<svg
								viewBox="0 0 16 16"
								fill="currentColor"
								xmlns="http://www.w3.org/2000/svg"
							>
								<path
									d="M10 1H6V6L1 6V10H6V15H10V10H15V6L10 6V1Z"
								></path>
							</svg>
						</button>
					</div>
				</div>

				<div class="chart-wrap">
					<div class="chart-canvas">
						<canvas id="myChart"></canvas>
					</div>
					<div class="chart-scroll">
						<div class="chart-spacer"></div>
					</div>
				</div>
			</div>
		</template>

		<template id="rilee-layout">
			<div class="links">
				<a class="genshin-link" href="?view=genshin">primo tracker</a>
			</div>
			<section class="hero" id="top">
				<h1>hey rilee!</h1>
				<p class="intro">happy three months, my love...</p>
				<div class="hero-playlist">
					<iframe
						data-testid="embed-iframe"
						style="border-radius: 12px"
						src="https://open.spotify.com/embed/playlist/2jv2q7baDGpx4jRc8Slo59?utm_source=generator&theme=0&si=8c39bf54bb8a4f62"
						width="100%"
						height="400"
						frameborder="0"
						allowfullscreen=""
						allow="
							autoplay;
							clipboard-write;
							encrypted-media;
							fullscreen;
							picture-in-picture;
						"
						loading="lazy"
					></iframe>
				</div>
			</section>

			<section class="memories">
				<div class="memories-heading">
					<h2 id="memories-title">cool moments so far!</h2>
				</div>
				<div class="memory-grid">
					<article class="memory-card">
						<img
							src="/static/img/rilee/scarf.jpeg"
							alt=""
							loading="lazy"
						/>
						<p class="moment">waterfront memories...</p>
						<p class="caption">i mean...</p>
					</article>
					<article class="memory-card">
						<img
							src="/static/img/rilee/smiski.jpeg"
							alt=""
							loading="lazy"
						/>
						<p class="moment">coming back to wellington</p>
						<p class="caption">and getting the right smiski!</p>
					</article>
					<article class="memory-card">
						<img
							src="/static/img/rilee/nate.jpeg"
							alt=""
							loading="lazy"
						/>
						<p class="moment">playing monopoly</p>
						<p class="caption">(and watching la la land)</p>
					</article>
					<article class="memory-card">
						<img
							src="/static/img/rilee/friendship island.jpeg"
							alt=""
							loading="lazy"
						/>
						<p class="moment">friendship island</p>
					</article>
					<article class="memory-card">
						<img
							src="/static/img/rilee/columbina.jpeg"
							alt=""
							loading="lazy"
						/>
						<p class="moment">columbina couple</p>
					</article>
					<article class="memory-card">
						<img
							src="/static/img/rilee/bots2.JPG"
							alt=""
							loading="lazy"
						/>
						<p class="moment">botanic gardens</p>
					</article>
				</div>
			</section>

			<section class="poems">
				<div class="poems-content">
					<h2 class="poems-heading" id="poems-title">poems</h2>
					<div class="poem-grid">
						<article class="poem">
							<p class="poem-text">
								everything grows still<br />
								the moment i hear your voice <br />
								only my heart beats
								<br /><br />all of those love songs<br />
								i never used to listen
								<br />they sound like you now
							</p>
						</article>
						<article class="poem">
							<p class="poem-text">
								romance with you<br />
								is a concept<br />
								like no other<br />
								ever present<br />
								elation
							</p>
						</article>
					</div>
				</div>
			</section>

			<section class="observations" aria-labelledby="observations-title">
				<div class="observations-content">
					<h2 class="poems-heading" id="observations-title">
						observations
					</h2>
					<ul class="observations-list">
						<li>inpt-t (wow!)</li>
						<li>quality time and acts of service</li>
						<li>first date was 29th of june</li>
						<li>started dating 10th of july</li>
					</ul>
				</div>
			</section>
		</template>
	</body>
</html>
